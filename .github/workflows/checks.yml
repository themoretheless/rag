name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RAG_EMBEDDING_PROVIDER: mock
      RAG_EMBEDDING_DIMS: '32'
      RAG_LLM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          # check-fmt-changed.sh compares the change against its merge base.
          fetch-depth: 0
      - name: Install stable Rust
        # The job died here on every run since feb5b9e: `rustup update` has no
        # --profile, so nothing below it - tests, eval, and the clippy/fmt gates - ever ran.
        # Minimal profile has to name the two components the gates call.
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Cache cargo registry and target
        # Bundled DuckDB is rebuilt from C++ sources on every cold run.
        uses: Swatinem/rust-cache@v2
      - name: Clippy without warnings
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Native client builds without the server crate (no DuckDB)
        run: cargo +stable clippy -p rag-mcp-ui --no-default-features --all-targets --locked -- -D warnings
      - name: Formatting of changed lines
        run: RUSTFMT_CMD="rustup run stable rustfmt" scripts/check-fmt-changed.sh
      - name: Test server, transports, CLI and native client
        run: cargo +stable test --workspace --locked
      - name: Run example retrieval regression
        run: cargo +stable run --locked --bin eval -- --modes lex --min-recall-at-k 0.5 --min-mrr 0.5 --json > eval-example.json
      - name: Repository retrieval baseline gate
        # Measured baseline (lex): recall@k 0.958, MRR 0.800. Thresholds sit
        # slightly below so ordinary noise passes but a real regression fails.
        run: cargo +stable run --locked --bin eval -- --dataset data/eval/repository-v1.json --modes lex --warmup 1 --repeat 3 --min-recall-at-k 0.9 --min-mrr 0.75 --json > eval-repository.json
      - name: Release-profile build
        # Only on main to save CI time; catches release-only (opt/LTO) breakage.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo +stable build --release --locked -p rag-mcp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-retrieval-report
          path: |
            eval-example.json
            eval-repository.json
          if-no-files-found: ignore

  rust-linux:
    # Lean Linux coverage: clippy only (tests run on macOS). Builds the egui
    # client with default features, so the X11/Wayland system libraries are needed.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install egui/winit system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy without warnings (workspace, default features)
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    # Declared rust-version (Cargo.toml) must keep compiling; check only, no tests.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install egui/winit system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace on the MSRV
        run: cargo check --workspace --locked

  supply-chain:
    # Advisories, licenses, bans and sources per deny.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck scripts/
        # shellcheck is preinstalled on ubuntu-latest runners.
        run: shellcheck scripts/*.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-svelte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-svelte/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
