[package]
name = "rag-mcp-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Native egui console for rag-mcp projects, search, documents, graph, and operations"
license = "MIT"
publish = false

[[bin]]
name = "rag-mcp-ui"
path = "src/main.rs"

[features]
# `--db`: open a DuckDB file read-only through `rag_store_duckdb::Store`. Build with
# `--no-default-features` for a gateway-only client without DuckDB.
default = ["direct-db"]
direct-db = ["dep:rag-store-duckdb"]

[dependencies]
# Serde-only wire types (GraphView / GraphNode / GraphEdge, PKB defaults).
rag-mcp-core = { path = "../rag-mcp-core" }
# Same [[wikilink]] parser the server uses to build graph edges.
rag-mcp-markup = { path = "../rag-mcp-markup" }
# Store crate (bundled DuckDB, no server/code-intel) only for the read-only `--db` mode.
rag-store-duckdb = { path = "../rag-store-duckdb", optional = true }

# Window + immediate mode (matched pair; plain Painter, no egui_graphs).
# Keep native accessibility while staying on the lightweight glow renderer.
eframe = { version = "=0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11"] }
egui = "=0.36.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# CLI: --snapshot / --db / --http / --seed / --depth / --max-nodes
clap = { version = "4", features = ["derive"] }

# Logging to stderr only (never stdout)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
