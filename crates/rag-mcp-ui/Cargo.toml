[package]
name = "rag-mcp-ui"
version = "0.1.0"
edition = "2021"
description = "Optional read-only egui graph inspector for rag-mcp (snapshot / exclusive DB)"
license = "MIT"
publish = false

[[bin]]
name = "rag-mcp-ui"
path = "src/main.rs"

[dependencies]
# Shared domain models (GraphView / GraphNode / GraphEdge); no GUI deps on rag-mcp
rag-mcp = { path = "../.." }

# Window + immediate mode (matched pair; plain Painter, no egui_graphs).
# Keep native accessibility while staying on the lightweight glow renderer.
eframe = { version = "=0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11"] }
egui = "=0.36.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# CLI: --snapshot / --db / --http / --seed / --depth / --max-nodes
clap = { version = "4", features = ["derive"] }

# Logging to stderr only (never stdout)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
