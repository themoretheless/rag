[package]
name = "rag-code-intel"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Code intelligence of rag-mcp: code index, external DB checks, gate, calibration, analysis tasks"
license = "MIT"
publish = false

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
duckdb = { workspace = true }
futures-util = "0.3"
rag-mcp-core = { workspace = true }
rag-store-duckdb = { workspace = true }
# Only `reqwest::Url` (drift source paths); same requirement as the root crate.
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
uuid = { workspace = true }
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-yaml = "0.7.2"
toml_edit = { version = "0.25.13", default-features = false, features = ["parse"] }
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
sqlparser = { version = "0.63.0", features = ["visitor"] }
regex = "1.13.1"
tree-sitter-css = "0.25.0"
cssparser = "0.36.0"
tree-sitter-html = "0.23.2"
html-escape = "0.2"
tree-sitter-php = "0.25.1"
tree-sitter-bash = "0.25.1"
tree-sitter-lua = "0.5.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-c-sharp = "0.23.5"
ts-parser-perl = "2.0.0"
tree-sitter-pwsh = "0.38.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "mysql", "mysql-rsa"] }

# Peak RSS for code-index timings (`resolution_cache::peak_rss_bytes`).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = []
# Enables the store's test hooks for tests of the crates above (see
# rag-store-duckdb's `testkit`).
testkit = ["rag-store-duckdb/testkit"]

[dev-dependencies]
encoding_rs = { workspace = true }
rag-store-duckdb = { workspace = true, features = ["testkit"] }
# A handful of tests drive the composed pipeline (source sync, file
# extraction, MCP access roles) from the root crate. A dev-dependency cycle is
# allowed; only `Store` (from rag-store-duckdb, shared by both builds) crosses it.
rag-mcp = { path = "../.." }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
