[package]
name = "rag-mcp-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Wire types (serde, chrono timestamps) shared by rag-mcp and its clients"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }

[dev-dependencies]
serde_json = "1"
