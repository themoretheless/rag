# cargo-deny policy (run in CI by the `supply-chain` job: `cargo deny check`).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# RustSec advisory DB. Vulnerabilities and unsound crates fail; unmaintained
# notices are reported for workspace dependencies only. Add an `ignore` entry
# with a reason (and an issue link) rather than loosening this section.
version = 2
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # rmcp 1.4.0: unbounded response buffering in the Streamable HTTP *clients*.
    # Only `server`, `transport-io` and `transport-streamable-http-server` are
    # enabled (`cargo tree -e features -i rmcp` shows no client feature), so the
    # affected code is not compiled. Fix needs rmcp >= 3.9 (two-major migration):
    # residual backlog in docs/refactor/INVENTORY.md.
    { id = "RUSTSEC-2026-0462", reason = "rmcp client transports are not enabled; server and stdio only" },
    # zip 6.0.0 is only a build-dependency of libduckdb-sys 1.10505.0
    # (`cargo tree -i zip@6.0.0`), whose build script unpacks DuckDB's own bundled
    # source archive. All four are in `ZipArchive::extract` on untrusted input.
    # Our own zip dependency is 9.x. Fix needs the DuckDB 2.0 crates: residual
    # backlog in docs/refactor/INVENTORY.md.
    { id = "RUSTSEC-2026-0367", reason = "zip 6 is a libduckdb-sys build-dependency unpacking DuckDB's bundled archive" },
    { id = "RUSTSEC-2026-0368", reason = "zip 6 is a libduckdb-sys build-dependency unpacking DuckDB's bundled archive" },
    { id = "RUSTSEC-2026-0369", reason = "zip 6 is a libduckdb-sys build-dependency unpacking DuckDB's bundled archive" },
    { id = "RUSTSEC-2026-0429", reason = "zip 6 is a libduckdb-sys build-dependency unpacking DuckDB's bundled archive" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Derived from the licenses actually present in Cargo.lock (2026-10). Every
# entry here is permissive; anything new (e.g. copyleft) must be reviewed.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Bundled fonts in egui's epaint_default_fonts.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# MPL-2.0 is file-level copyleft, so it is not in the global allow-list. These
# four crates (the Servo CSS parser stack behind `cssparser` and `dom_query`)
# are used as unmodified dependencies, which MPL-2.0 permits without obligations
# on our own files. A new MPL crate must be reviewed and listed here.
exceptions = [
    { name = "cssparser", allow = ["MPL-2.0"] },
    { name = "cssparser-macros", allow = ["MPL-2.0"] },
    { name = "dtoa-short", allow = ["MPL-2.0"] },
    { name = "selectors", allow = ["MPL-2.0"] },
]

[bans]
# Duplicate versions are common in the egui/wgpu and reqwest trees; report but
# do not fail. Wildcard path deps inside the workspace are allowed.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
