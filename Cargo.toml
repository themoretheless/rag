[workspace]
members = [".", "crates/rag-mcp-core", "crates/rag-mcp-markup", "crates/rag-mcp-ui"]
default-members = ["."]
resolver = "2"

[package]
name = "rag-mcp"
version = "0.1.0"
edition = "2021"
# MSRV: egui/eframe (rag-mcp-ui) declare rust-version 1.95, the highest in
# Cargo.lock, so the workspace uses that floor. CI builds on stable (1.97 at time
# of writing) and the `msrv` job in checks.yml runs `cargo check` on 1.95.
rust-version = "1.95"
description = "RAG MCP server backed by DuckDB"
license = "MIT"
readme = "README.md"

[[bin]]
name = "rag-mcp"
path = "src/main.rs"

[[bin]]
name = "ingest_project"
path = "src/bin/ingest_project.rs"

[[bin]]
name = "ingest_file"
path = "src/bin/ingest_file.rs"

[[bin]]
name = "rag_gate"
path = "src/bin/rag_gate.rs"

[dependencies]
tempfile = "3"
rag-mcp-core = { path = "crates/rag-mcp-core", version = "0.1.0" }
rag-mcp-markup = { path = "crates/rag-mcp-markup", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
axum = "0.8"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
duckdb = { version = "1", features = ["bundled"] }
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rmcp = { version = "=1.4.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
# rmcp 1.x did not keep macro/runtime compatibility across every minor; pin the
# proc-macro crate to the matching security-fixed release as well.
rmcp-macros = "=1.4.0"
tokio-util = { version = "0.7", features = ["rt"] }
# Same major as rmcp's re-export so Cargo.lock holds one schemars version.
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Process/system resource telemetry for the /v1/resources endpoint.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
unicode-normalization = "0.1.25"
# Pure-Rust (miniz_oxide) zip reading for OOXML (.docx/.xlsx) extraction.
zip = { version = "6", default-features = false, features = ["deflate"] }
# XML event parser for OOXML document/styles/sheet parts.
quick-xml = "0.42"
# html5ever-based DOM queries for HTML main-content extraction (pure Rust).
dom_query = "0.27"
# Optional HF tokenizers backend for token counting: loaded from a local
# tokenizer.json via RAG_TOKENIZER_JSON; falls back to the calibrated
# heuristic when unset. crates.io is unreachable, so this stays optional.
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"], optional = true }
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-yaml = "0.7.2"
toml_edit = { version = "0.25.13", default-features = false, features = ["parse"] }
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
sqlparser = { version = "0.63.0", features = ["visitor"] }
regex = "1.13.1"
tree-sitter-css = "0.25.0"
cssparser = "0.36.0"
tree-sitter-html = "0.23.2"
html-escape = "0.2"
tree-sitter-php = "0.25.1"
tree-sitter-bash = "0.25.1"
tree-sitter-lua = "0.5.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-c-sharp = "0.23.5"
ts-parser-perl = "2.0.0"
tree-sitter-pwsh = "0.38.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "mysql", "mysql-rsa"] }
encoding_rs = "=0.8.35"

# Only read by ops::free_space_bytes for the automatic snapshot disk guard.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Exact HF token counting when RAG_TOKENIZER_JSON points at a tokenizer.json;
# without the env var the calibrated heuristic is used either way.
default = ["tokenizers"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# Debug info dominates build output: every test and binary target statically
# links bundled DuckDB. Line tables keep panic backtraces readable for our code;
# dependencies need none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

# Production builds (`cargo build --release`, see docs/PROD_RUN.md): one codegen
# unit plus thin LTO lets rustc inline across crates (serde, duckdb glue, axum)
# at a modest link-time cost; debug info is dropped from shipped binaries.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
