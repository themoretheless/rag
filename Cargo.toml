[workspace]
members = [".", "crates/rag-mcp-core", "crates/rag-mcp-markup", "crates/rag-mcp-ui", "crates/rag-store-duckdb", "crates/rag-code-intel"]
default-members = ["."]
resolver = "2"

# Versions of dependencies used by two or more workspace crates, declared once.
# Members add their own features; features are additive, so no member loses
# any it had. crates/rag-mcp-ui is maintained in another worktree and still
# pins its own versions (same requirements as here). rag-mcp-core keeps its own
# chrono line: it deliberately builds it without default features.
[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
unicode-normalization = "0.1.25"
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
duckdb = { version = "1", features = ["bundled"] }
lin = { git = "https://github.com/themoretheless/lin", branch = "release", version = "0.7.1", features = ["compress-zstd", "parallel"] }
rusqlite = { version = "0.42", features = ["bundled"] }
ring = "0.17"
# Same major as rmcp's re-export so Cargo.lock holds one schemars version.
schemars = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Optional HF tokenizers backend for token counting: loaded from a local
# tokenizer.json via RAG_TOKENIZER_JSON; falls back to the calibrated
# heuristic when unset.
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
encoding_rs = "=0.8.35"
rag-mcp-core = { path = "crates/rag-mcp-core", version = "0.1.0" }
rag-mcp-markup = { path = "crates/rag-mcp-markup", version = "0.1.0" }
rag-store-duckdb = { path = "crates/rag-store-duckdb", version = "0.1.0" }
rag-code-intel = { path = "crates/rag-code-intel", version = "0.1.0" }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.clippy]
collapsible_if = "allow"

[package]
name = "rag-mcp"
version = "0.1.0"
edition = "2024"
# MSRV: egui/eframe (rag-mcp-ui) declare rust-version 1.95, the highest in
# Cargo.lock, so the workspace uses that floor. CI builds on stable (1.97 at time
# of writing) and the `msrv` job in checks.yml runs `cargo check` on 1.95.
rust-version = "1.95"
description = "RAG MCP server backed by DuckDB"
license = "MIT"
readme = "README.md"

[[bin]]
name = "rag-mcp"
path = "src/main.rs"

[[bin]]
name = "ingest_project"
path = "src/bin/ingest_project.rs"

[[bin]]
name = "ingest_file"
path = "src/bin/ingest_file.rs"

[[bin]]
name = "rag_gate"
path = "src/bin/rag_gate.rs"

[[bin]]
name = "migrate_to_lin"
path = "src/bin/migrate_to_lin.rs"

[[bin]]
name = "bench_duckdb_vs_lin"
path = "src/bin/bench_duckdb_vs_lin.rs"

[lints]
workspace = true

[dependencies]
tempfile = { workspace = true }
clap = { workspace = true }
rag-mcp-core = { workspace = true }
rag-mcp-markup = { workspace = true }
rag-store-duckdb = { workspace = true }
rag-code-intel = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
axum = "0.8"
blake3 = { workspace = true }
chrono = { workspace = true }
duckdb = { workspace = true }
lin = { workspace = true }
rusqlite = { workspace = true }
notify = "8"
reqwest = { workspace = true }
ring = { workspace = true }
rmcp = { version = "=1.4.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
# rmcp 1.x did not keep macro/runtime compatibility across every minor; pin the
# proc-macro crate to the matching security-fixed release as well.
rmcp-macros = "=1.4.0"
tokio-util = { version = "0.7", features = ["rt"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Process/system resource telemetry for the /v1/resources endpoint.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
# Pure-Rust (miniz_oxide) zip reading for OOXML (.docx/.xlsx) extraction.
zip = { version = "9", default-features = false, features = ["deflate"] }
# XML event parser for OOXML document/styles/sheet parts.
quick-xml = "0.42"
# html5ever-based DOM queries for HTML main-content extraction (pure Rust).
dom_query = "0.27"


# Only read by ops::free_space_bytes for the automatic snapshot disk guard.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
# Exact HF token counting when RAG_TOKENIZER_JSON points at a tokenizer.json;
# without the env var the calibrated heuristic is used either way.
default = ["tokenizers"]
tokenizers = ["rag-store-duckdb/tokenizers"]
# Exposes `rag_mcp::testkit` (shared fixtures) to the integration tests. Unit
# tests get the module through `cfg(test)`; production builds never enable it.
testkit = ["rag-store-duckdb/testkit", "rag-code-intel/testkit"]

[dev-dependencies]
# Test fixtures encode legacy code pages (the decoder lives in the store crate).
encoding_rs = { workspace = true }
tokio = { version = "1", features = ["full", "test-util"] }
# Self dev-dependency: turns the `testkit` feature on for test targets only
# (`cargo test` then needs no `--features`, so no target is silently skipped).
rag-mcp = { path = ".", features = ["testkit"] }

# Debug info dominates build output: every test and binary target statically
# links bundled DuckDB. Line tables keep panic backtraces readable for our code;
# dependencies need none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# Light optimisation for dependencies only (DuckDB glue, serde, tokio,
# tree-sitter): our own crates stay at opt-level 0 for fast rebuilds. The test
# profile inherits from dev. Measured in docs/refactor/BASELINE.md.
opt-level = 1

[profile.test]
debug = "line-tables-only"

# Production builds (`cargo build --release`, see docs/PROD_RUN.md): one codegen
# unit plus thin LTO lets rustc inline across crates (serde, duckdb glue, axum)
# at a modest link-time cost; debug info is dropped from shipped binaries.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
